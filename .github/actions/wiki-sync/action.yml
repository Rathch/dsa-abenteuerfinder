name: Wiki catalog sync
description: Prüft die Erreichbarkeit von Wiki Aventurica und synchronisiert den Katalog.

runs:
  using: composite
  steps:
    - name: Check wiki reachability
      shell: bash
      run: |
        set -u
        reachable=0
        for attempt in 1 2; do
          ip="$(getent ahostsv4 de.wiki-aventurica.de | awk 'NR==1 { print $1 }')"
          echo "Wiki-IPv4 Versuch ${attempt}: ${ip:-keine Auflösung}"
          if [ -n "${ip}" ] && [[ "${ip}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            if timeout -k 2 8 bash -c "echo >/dev/tcp/${ip}/443"; then
              reachable=1
              break
            fi
          fi
          if [ "${attempt}" -eq 1 ]; then
            sleep 3
          fi
        done
        if [ "${reachable}" -ne 1 ]; then
          echo "Dieser Runner erreicht de.wiki-aventurica.de:443 nicht."
          echo "Ein weiterer Versuch startet auf einem neuen Runner."
          exit 1
        fi

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.5"
        extensions: mbstring, xml, ctype, json, tokenizer, dom, curl, pdo_sqlite
        coverage: none
        tools: composer:v2

    - name: Install dependencies
      shell: bash
      run: composer install --no-interaction --no-progress --prefer-dist --no-dev

    - name: Prepare Laravel env
      shell: bash
      run: |
        cp .env.example .env
        php artisan key:generate --force
        touch database/database.sqlite
        php artisan migrate --force --no-interaction

    - name: Sync wiki catalog
      shell: bash
      run: php artisan adventures:sync-wiki --no-interaction

    - name: Commit catalog
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add database/data
        if git diff --cached --quiet; then
          echo "Keine Katalogänderung."
        else
          git commit -m "Synchronisiere den Wiki-Katalog"
          git push
        fi
