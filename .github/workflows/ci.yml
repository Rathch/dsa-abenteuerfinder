# Quality Gates: Pint, PHPStan, Deptrac, Pest für die Wiki-Pipeline,
# npm run build, Vitest und Playwright gegen vite preview.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-quality:
    name: Pint, PHPStan, Deptrac, composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, xml, ctype, json, tokenizer, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Laravel Pint (check only)
        run: vendor/bin/pint --test

      - name: PHPStan (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Deptrac (Architektur-Schichten)
        run: vendor/bin/deptrac analyse --no-progress

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

  pest:
    name: Pest (Wiki-Pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, xml, ctype, json, tokenizer, bcmath, fileinfo, pdo_sqlite
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Laravel env
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite

      - name: Pest
        run: vendor/bin/pest --compact
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

  playwright:
    name: Vitest und Playwright gegen vite preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Vitest
        run: npm run test:domain

      - name: Install Playwright Chromium
        run: npm run test:visual:install

      - name: Playwright
        run: npm run test:visual:ci
        env:
          CI: true
          PLAYWRIGHT_MANAGE_SERVER: "1"

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
