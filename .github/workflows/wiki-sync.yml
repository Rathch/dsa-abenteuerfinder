name: Wiki sync

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Wiki-Katalog prüfen und committen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, xml, ctype, json, tokenizer, dom, curl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Prepare Laravel env
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: Sync wiki catalog
        run: |
          set -u
          for attempt in 1 2 3 4; do
            echo "Wiki-Sync Versuch ${attempt}"
            getent ahostsv4 de.wiki-aventurica.de || true
            if php artisan adventures:sync-wiki --no-interaction; then
              exit 0
            fi
            if [ "${attempt}" -lt 4 ]; then
              echo "Wiki nicht erreichbar, nächster Versuch in 90 Sekunden."
              sleep 90
            fi
          done
          exit 1

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/data
          if git diff --cached --quiet; then
            echo "Keine Katalogänderung."
          else
            git commit -m "Synchronisiere den Wiki-Katalog"
            git push
          fi
