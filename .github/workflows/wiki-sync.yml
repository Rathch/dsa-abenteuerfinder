# Ein TCP-Timeout zum Wiki bleibt auf demselben Runner bestehen. Jeder Job
# ist deshalb eine neue VM. Der nächste Job startet nur nach einem Fehlschlag.
name: Wiki sync

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Wiki-Katalog prüfen und committen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/wiki-sync

  sync-retry:
    name: Wiki-Katalog, neuer Runner
    needs: sync
    if: ${{ !cancelled() && needs.sync.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/wiki-sync

  sync-retry-again:
    name: Wiki-Katalog, dritter Runner
    needs: sync-retry
    if: ${{ !cancelled() && needs.sync-retry.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/wiki-sync
