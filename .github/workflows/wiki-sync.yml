name: Wiki sync

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Wiki-Katalog prüfen und committen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, xml, ctype, json, tokenizer, dom, curl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Prepare Laravel env
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: Sync wiki catalog
        run: php artisan adventures:sync-wiki --no-interaction

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/data
          if git diff --cached --quiet; then
            echo "Keine Katalogänderung."
          else
            git commit -m "Synchronisiere den Wiki-Katalog"
            git push
          fi
